# The conformance title: a stand-in for an Xbox title, written by us from
# public documentation only (docs/acceptance.md). It is NOT a workspace
# member: crates/victory-hle/tests/conformance.rs builds it on demand and
# runs it through VIctory's own loader and runtime. It links no SDK.
[package]
name = "conformance"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[workspace]

[dependencies]
# Compresses the zlib requests DirectStorage inflates.
miniz_oxide = "0.9.1"
